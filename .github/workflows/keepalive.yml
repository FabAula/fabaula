# El pla gratuït de Supabase pausa el projecte després de 7 dies sense activitat
# (vacances de Nadal, Setmana Santa, estiu...). Aquesta tasca fa una consulta
# mínima cada 3 dies perquè no passi.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sf -X POST "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
